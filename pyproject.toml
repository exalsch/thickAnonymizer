[project]
name = "thickanon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "presidio-analyzer",
  "presidio-anonymizer",
  "python-docx",
  "openpyxl",
  "python-pptx",
  "cryptography",
  "pywebview",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
thickanon = "thickanon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
