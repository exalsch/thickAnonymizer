[project]
name = "thickanon"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Schick" }]
# Lower bounds are the versions the test suite last passed on (23.11.2026).
# Exact versions for a reproducible exe build live in requirements-lock.txt.
dependencies = [
  "presidio-analyzer>=2.2.366",
  "presidio-anonymizer>=2.2.366",
  # en_core_web_lg 3.8.0 requires spaCy 3.8.x; a spaCy 3.9 needs a new model.
  "spacy>=3.8.18,<3.9",
  # docx, xlsx and pptx are read and written at the XML level (thickanon.io.ooxml).
  "lxml>=6.1.3",
  "cryptography>=50.0.2",
  "pywebview>=6.2.1",
  # GLiNER runs as an ONNX model on onnxruntime, without torch (detectors/gliner_onnx.py).
  "onnxruntime>=1.32.0",
  "tokenizers>=0.23.3",
  "huggingface-hub>=2.4.0",
  "numpy>=2.4.6",
]

[project.optional-dependencies]
# The Office libraries only build sample files for the tests.
dev = [
  "pytest>=9.2.0", "pyinstaller>=6.22.3", "pip-audit>=2.10.1",
  "python-docx>=1.2.0", "openpyxl>=3.1.5", "python-pptx>=1.0.2",
]

[project.scripts]
thickanon = "thickanon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"
